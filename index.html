<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coding Database</title><style>:root{--card:#101c2d;--text:#f4f7fb;--muted:#a7b4c7;--green:#39d98a;--line:#263850}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101d,#0a1728);color:var(--text);font-family:system-ui,Arial;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:22px}.hero,.notice{border:1px solid var(--line);border-radius:24px;background:#0d1a2b;padding:26px}.hero h1{font-size:clamp(2rem,5vw,4rem);margin:5px 0}.muted,.hero p{color:var(--muted)}.search{display:grid;grid-template-columns:1fr 210px;gap:10px;margin-top:20px}input,select{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:#071321;color:white}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.chip,.refresh{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:white;cursor:pointer}.chip.active{background:var(--green);color:#042014;font-weight:800}.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:18px;display:flex;flex-direction:column;min-height:225px}.card h3{margin:12px 0 7px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tag{font-size:.75rem;border:1px solid var(--line);padding:5px 8px;border-radius:99px}.open{margin-top:auto;text-align:center;padding:11px;border-radius:12px;background:var(--green);color:#052014;text-decoration:none;font-weight:800}.notice{display:none;margin:18px 0;color:#ffd58a}.empty{display:none;text-align:center;color:var(--muted);padding:30px}@media(max-width:650px){.search{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section class="hero"><div style="color:#39d98a;font-weight:800">OSEBNA TEHNIČNA KNJIŽNICA</div><h1>🔧 Coding Database</h1><p>Samodejni prikaz PDF navodil iz mape pdf/kamere.</p><div class="search"><input id="q" placeholder="Išči PDF, vozilo, modul ..."><select id="sort"><option value="az">Naslov A–Ž</option><option value="za">Naslov Ž–A</option></select></div><div class="status"><span>Prikazanih: <b id="count">0</b></span><button class="refresh" id="refresh">↻ Osveži PDF-je</button></div></section><div id="notice" class="notice"></div><nav id="chips" class="chips"></nav><section id="grid" class="grid"></section><div id="empty" class="empty">V mapi ni PDF datotek.</div></main><script>
const API='https://api.github.com/repos/blaz-star1111/CODING-TUTORIAL/contents/pdf/kamere';
const PAGES_BASE='https://blaz-star1111.github.io/CODING-TUTORIAL/pdf/kamere/';
let docs=[],active='Vse';const q=document.querySelector('#q'),sort=document.querySelector('#sort'),grid=document.querySelector('#grid'),chips=document.querySelector('#chips');
const pretty=n=>n.replace(/\.pdf$/i,'').replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const pagesUrl=name=>PAGES_BASE+name.split('/').map(encodeURIComponent).join('/');
async function load(){document.querySelector('#refresh').textContent='↻ Nalagam ...';document.querySelector('#notice').style.display='none';try{const r=await fetch(API,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('Mape pdf/kamere ni mogoče prebrati.');const a=await r.json();docs=a.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.pdf')).map(x=>({title:pretty(x.name),file:pagesUrl(x.name),category:'Vzvratne kamere',name:x.name}));}catch(e){docs=[];const n=document.querySelector('#notice');n.textContent=e.message+' Preveri, ali je repository javen in mapa pdf/kamere obstaja.';n.style.display='block'}document.querySelector('#refresh').textContent='↻ Osveži PDF-je';drawChips();render()}
function drawChips(){const cats=['Vse',...new Set(docs.map(d=>d.category))];chips.innerHTML=cats.map(c=>`<button class="chip ${c===active?'active':''}" data-c="${c}">${c}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.c;drawChips();render()})}
function render(){const s=q.value.toLowerCase();let a=docs.filter(d=>(active==='Vse'||d.category===active)&&(d.title+' '+d.name).toLowerCase().includes(s));a.sort((x,y)=>(sort.value==='az'?1:-1)*x.title.localeCompare(y.title,'sl'));grid.innerHTML=a.map(d=>`<article class="card"><div style="font-size:2rem">🎥</div><h3>${d.title}</h3><p class="muted">PDF navodilo za retrofit ali coding vzvratne kamere.</p><div class="tags"><span class="tag">Kamera</span><span class="tag">Samodejno dodano</span></div><a class="open" href="${d.file}" target="_blank" rel="noopener noreferrer">📄 Odpri PDF</a></article>`).join('');document.querySelector('#count').textContent=a.length;document.querySelector('#empty').style.display=a.length?'none':'block'}
q.oninput=render;sort.onchange=render;document.querySelector('#refresh').onclick=load;load();
</script></body></html>
